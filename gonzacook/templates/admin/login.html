<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-family: system-ui, -apple-system, sans-serif;
      color: #eee;
    }
    .card {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
    .alert {
      padding: .75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: .9rem;
    }
    .alert.error { background: #4a1a1a; border: 1px solid #7a2a2a; color: #f88; }
    label { display: block; font-size: .85rem; color: #aaa; margin-bottom: .3rem; }
    input {
      width: 100%;
      padding: .65rem .75rem;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #eee;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #c9a05a; }
    button {
      width: 100%;
      padding: .75rem;
      background: #c9a05a;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #b8903a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Chef 🍪</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" action="/chef/login">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
